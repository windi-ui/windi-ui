name: CI

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  NODE_VER: 26

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js v${{env.NODE_VER}}
        uses: actions/setup-node@v7
        with:
          node-version: ${{env.NODE_VER}}
          cache: pnpm

      - name: Install dependencies
        run: pnpm -r install

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm run lint

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js v${{env.NODE_VER}}
        uses: actions/setup-node@v7
        with:
          node-version: ${{env.NODE_VER}}
          cache: pnpm

      - name: Install dependencies
        run: pnpm -r install

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck
