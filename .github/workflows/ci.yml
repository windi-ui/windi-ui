name: CI

on:
  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  NODE_VER: 26

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js v${{env.NODE_VER}}
        uses: actions/setup-node@v7
        with:
          node-version: ${{env.NODE_VER}}
          cache: pnpm

      - name: Install dependencies
        run: pnpm -r install

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm run lint

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js v${{env.NODE_VER}}
        uses: actions/setup-node@v7
        with:
          node-version: ${{env.NODE_VER}}
          cache: pnpm

      - name: Install dependencies
        run: pnpm -r install

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The contrast matrix of the default config and the `nuxt-ui` preset, in the job summary. The defaults are not
      # calibrated, which is each project's own choice, so the audit exits with 1 and that is let through; an error
      # (exit 2) fails the job. `test/audit.test.ts` pins the failures and the calls that fix them.
      - name: Contrast audit
        run: |
          for config in "" "--config test/config/nuxt-ui.ts"; do
            printf '\n### windiui audit %s\n\n' "$config" >> "$GITHUB_STEP_SUMMARY"
            node packages/windiui-core/dist/cli.mjs audit $config --text 4.5 --border 3 --format markdown >> "$GITHUB_STEP_SUMMARY" || [ $? -eq 1 ]
          done
