packages:
  - 'packages/*'
  - 'docs'
  - 'playground/*'
  - 'test/fixtures/*'
allowBuilds:
  esbuild: true
permissions:
  tsdown:
    skills: false
autoInstallPeers: true
ignoreWorkspaceRootCheck: true
strictPeerDependencies: false
# pnpm 12 refuses versions younger than a day by default; Renovate PRs land within hours of a release.
minimumReleaseAge: 0
